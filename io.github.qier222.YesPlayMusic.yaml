app-id: io.github.qier222.YesPlayMusic
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
separate-locales: false
rename-icon: yesplaymusic
rename-desktop-file: yesplaymusic.desktop
command: yesplaymusic
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.yesplaymusic
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/gtk-doc

modules:
  - name: yt-dlp
    no-autogen: true
    no-make-install: true
    make-args:
      - yt-dlp
      - PYTHON=/usr/bin/python3
    post-install:
      - install yt-dlp /app/bin
    sources:
      - type: git
        url: https://github.com/yt-dlp/yt-dlp.git
        tag: 2026.10.26
        commit: f264a6cbd1f630894da0f368df00f8aae50140e0
        x-checker-data:
          type: git
          tag-pattern: ^(\d{4}\.\d{2}\.\d{2})$

  - name: yesplaymusic
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - bsdtar --to-stdout -xf yesplaymusic.deb data.* | bsdtar -xf -
      - cp -a opt/YesPlayMusic $FLATPAK_DEST/
      - rm -r usr/share/doc
      - rm -r usr/share/icons/hicolor/1024x1024
      - cp -a usr/share $FLATPAK_DEST/
      - desktop-file-edit --set-key="Exec" --set-value="yesplaymusic %U" $FLATPAK_DEST/share/applications/*.desktop
      - desktop-file-edit --set-key="Categories" --set-value="AudioVideo" $FLATPAK_DEST/share/applications/*.desktop
      - install -Dm644 io.github.qier222.YesPlayMusic.metainfo.xml -t /app/share/metainfo
      - install -Dm755 yesplaymusic.sh /app/bin/yesplaymusic
    sources:
      - type: file
        dest-filename: yesplaymusic.deb
        only-arches:
          - aarch64
        url: https://github.com/qier222/YesPlayMusic/releases/download/v0.4.11/yesplaymusic_0.4.11_arm64.deb
        sha256: e956e2fa8fa2ecc12441e3718fab4d08db3b33efbdf95a475d00fe8cd852ed42
        x-checker-data:
          type: json
          url: https://api.github.com/repos/qier222/YesPlayMusic/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name | test("yesplaymusic_" + $version + "_arm64.deb"))
            |
            .browser_download_url

      - type: file
        dest-filename: yesplaymusic.deb
        only-arches:
          - x86_64
        url: https://github.com/qier222/YesPlayMusic/releases/download/v0.4.11/yesplaymusic_0.4.11_amd64.deb
        sha256: 17a39a83ba5d799cbd517c2c182994cdb9b254cfba92fd10dbfb27cdcf421714
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/qier222/YesPlayMusic/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name | test("yesplaymusic_" + $version + "_amd64.deb"))
            |
            .browser_download_url

      - type: file
        path: io.github.qier222.YesPlayMusic.metainfo.xml

      - type: script
        dest-filename: yesplaymusic.sh
        commands:
          - export TMPDIR=$XDG_RUNTIME_DIR/app/$FLATPAK_ID
          - exec zypak-wrapper.sh /app/YesPlayMusic/yesplaymusic "$@"
